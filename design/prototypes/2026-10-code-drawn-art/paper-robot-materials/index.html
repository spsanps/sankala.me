<h1 class="sr">One robot, many hands — the Paper Robots robot in eight hand processes</h1>
<canvas id="art" role="img" aria-label="A small blue folded-paper robot with a red disc ear stands on a stone plinth before a sun. Every two seconds the whole picture is re-made in a different hand process: gouache, cyanotype, linocut, risograph, banknote engraving, origami, woodblock and cross-stitch, while the robot keeps blinking and glancing around."></canvas>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   DESIGN — One robot, many hands                      Paper Robots · sting/hero

   The idea
   The Paper Robots robot holds one pose in one composition while the world
   is re-made around it every two seconds by a different hand process. The
   subject is the constant; the material is the voice. Every process is
   simulated (how the ink or thread or light actually behaves), not a filter
   over the same picture. Eight beats × 2 s = a seamless 16 s loop that ends
   by cutting back to the house style. Thesis: every way to put a robot on
   paper (and one on cloth).

   The skeleton (defined once, in robot units — see SKELETON)
   Cube head with a dog-eared white corner (top right), two round eyes, a
   vermilion disc ear on the right side; neck, torso, arms, hands, legs, feet;
   a stone plinth; a sun disc behind. Fixed oblique projection: top = lit,
   front = middle, side = shade. Idle motion is shared by all eight: head
   tilt, blinks, a saccade to a new glance at each cut, a small pop when the
   world changes, the ear catching light.

   The beats — the colour is the cut (each field differs from its neighbours)
   1 GOUACHE      paper #efe3c8  cobalt #2a4db4 / top #5a80d8 / side #172e80
                  vermilion #e3492a  sun #f2bc4e  stone #d9b070  hills #7c93d2
                  bristle strokes, blotches, pigment pooled at edges, dry-brush,
                  granulation; sunflowers from the channel banner.
   2 CYANOTYPE    paper #f3f0e5  mid #4a78bb  deep #0f2c6c
                  photogram: the robot is a paper cut-out (tissue tops, cartridge
                  fronts, card sides), eyes are holes, the ear a cellophane
                  window; ferns and grasses; brushed emulsion with dry ends;
                  per-pixel exposure → Prussian blue density, lifted edges blur.
   3 LINOCUT      paper #eeae2a  ink #1d1a2b
                  one block: white-line separations, per-plane gouge hatching,
                  rays cut from the sky; hand print with brayer streaks, paper
                  tooth breaking the solids.
   4 RISOGRAPH    paper #f3efe6  fluorescent pink #ff48b0  blue #0078bf
                  two drums: grain dither for tints, AM halftone at 45° on the
                  sun, blue drum out of register, multiply overprint to violet,
                  starved floods.
   5 ENGRAVING    paper #ebedd9  intaglio #1d3631  serial red #b4372b
                  underprint #f2cfa6 → #bfe0d2
                  burin lines that swell with tone, each plane cut in its own
                  direction, cross-hatched shade; lathe-work oval, guilloche rope
                  border, epitrochoid rosettes, microprinted ring.
   6 ORIGAMI      wall #d4412a  floor #e2573c  kami #2747aa  kraft #c99c63
                  a photographed paper model: Lambert-ish planes, edge light,
                  pre-creases, white underside at the dog-ear, glued eyes with
                  shadows, a folded sun, soft cast shadows, shallow depth of field.
   7 WOODBLOCK    washi #eee3c9  sumi #2a2521  bero #24497f  shu #c94429
                  mist #e7b9a3  hills #8ea0bf  green #7f9157  pine #3f5a3a
                  key block + colour blocks with wood grain and baren swirl,
                  bokashi wipes, registration drift, figure carved out of every
                  block behind it, mist bands left unprinted, a seal.
   8 CROSS-STITCH cloth #1b1a20  threads: cobalt #2f57c8 sky #86a9ee navy #1a2a78
                  white #f3efe6 vermilion #e2492d gold #f4b53d green #4d8a3b
                  black aida, modelled X stitches (bottom leg, top leg, strand
                  twist), backstitch outlines and lettering, French knots; the
                  head is re-stitched each frame, so it tilts and blinks stitch
                  by stitch.

   Rules
   — One composition for every beat; only the hand changes.
   — Each print carries its own edition mark ("n/8 PROCESS" · "PAPER ROBOTS")
     in that medium's idiom: pencil, printed ink, engraving, backstitch.
   — Seeded randomness everywhere; ?t=<seconds> renders one exact frame.
   — No image files, no libraries: canvas 2D only, including the lettering
     (a single-stroke alphabet drawn as polylines).

   Refusals
   No AI beige, no decorative italic serif, no side-tab borders, no pulsing
   dots, no glossy gradients standing in for material, no interface chrome.
   No borrowed characters: the figure is the Paper Robots robot.
   ═══════════════════════════════════════════════════════════════════════════ */
// ───────────────────────────────────────────────────────────── utilities
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const fract = v => v - Math.floor(v);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y, s = 0) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 982451653);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4, s = 0, lac = 2.03, gain = 0.5) {
  let sum = 0, amp = 0.5, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x, y, s + i * 17); norm += amp; x *= lac; y *= lac; amp *= gain; }
  return sum / norm;
}
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mixRGB(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function shadeRGB(c, k) { return k >= 0 ? mixRGB(c, [255, 255, 255], k) : mixRGB(c, [0, 0, 0], -k); }

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
function ctxOf(c) { return c.getContext('2d', { willReadFrequently: false }); }

// polygon helpers ---------------------------------------------------------
function polyPath(ctx, pts, close = true) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (close) ctx.closePath();
}
function fillPoly(ctx, pts, style) { ctx.beginPath(); polyPath(ctx, pts); ctx.fillStyle = style; ctx.fill(); }
function centroid(pts) { let x = 0, y = 0; for (const p of pts) { x += p[0]; y += p[1]; } return [x / pts.length, y / pts.length]; }
function bboxOf(pts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) { if (p[0] < x0) x0 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[0] > x1) x1 = p[0]; if (p[1] > y1) y1 = p[1]; }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
}
function insidePoly(x, y, pts) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
// subdivide each edge and jitter perpendicular: hand-cut / hand-carved edges
function wobble(pts, step, amp, rnd, close = true) {
  const out = [];
  const n = pts.length;
  for (let i = 0; i < (close ? n : n - 1); i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    const k = Math.max(1, Math.round(len / step));
    const nx = -dy / (len || 1), ny = dx / (len || 1);
    for (let j = 0; j < k; j++) {
      const t = j / k;
      const o = j === 0 ? amp * 0.3 * (rnd() - 0.5) : amp * (rnd() - 0.5);
      out.push([a[0] + dx * t + nx * o, a[1] + dy * t + ny * o]);
    }
  }
  if (!close) out.push(pts[n - 1]);
  return out;
}
// inset polygon (convex, CW or CCW agnostic) by d
function insetPoly(pts, d) {
  const c = centroid(pts);
  return pts.map(p => { const dx = p[0] - c[0], dy = p[1] - c[1], l = Math.hypot(dx, dy) || 1; return [p[0] - dx / l * d, p[1] - dy / l * d]; });
}
function lerpPt(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t)]; }
function ellipsePts(cx, cy, rx, ry, n = 48, rot = 0) {
  const out = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; const x = Math.cos(a) * rx, y = Math.sin(a) * ry; out.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); }
  return out;
}
// clip a segment p0-p1 to convex/concave polygon via sampling (returns list of [t0,t1])
function segInside(p0, p1, pts, samples = 80) {
  const res = []; let start = -1;
  for (let i = 0; i <= samples; i++) {
    const t = i / samples, x = lerp(p0[0], p1[0], t), y = lerp(p0[1], p1[1], t);
    const ins = insidePoly(x, y, pts);
    if (ins && start < 0) start = t;
    if ((!ins || i === samples) && start >= 0) { res.push([start, ins ? t : t - 1 / samples]); start = -1; }
  }
  return res;
}

// pixel helpers -----------------------------------------------------------
// Generators yield to let the real-time scheduler slice heavy work across frames.
function* pixelRows(h, fn) { for (let y = 0; y < h; y++) { fn(y); if ((y & 15) === 15) yield; } }
// grayscale field into a canvas
function* fieldToCanvas(c, fn) {
  const w = c.width, h = c.height, ctx = ctxOf(c), img = ctx.createImageData(w, h), d = img.data;
  yield* pixelRows(h, y => { for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; const v = fn(x, y); d[i] = v[0]; d[i + 1] = v[1]; d[i + 2] = v[2]; d[i + 3] = v[3] === undefined ? 255 : v[3]; } });
  ctx.putImageData(img, 0, 0);
}
function readAlpha(c) {
  const d = ctxOf(c).getImageData(0, 0, c.width, c.height).data;
  const a = new Float32Array(c.width * c.height);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4 + 3] / 255;
  return a;
}
function readGray(c) {
  const d = ctxOf(c).getImageData(0, 0, c.width, c.height).data;
  const a = new Float32Array(c.width * c.height);
  for (let i = 0; i < a.length; i++) a[i] = d[i * 4] / 255;
  return a;
}
// separable box blur on a float field (approx gaussian with 3 passes)
function blurField(src, w, h, r) {
  r = Math.max(1, Math.round(r));
  let a = Float32Array.from(src), b = new Float32Array(src.length);
  const pass = (inp, out, horiz) => {
    const n = horiz ? w : h, m = horiz ? h : w, inv = 1 / (2 * r + 1);
    for (let j = 0; j < m; j++) {
      let acc = 0;
      const idx = k => horiz ? j * w + clampI(k, 0, w - 1) : clampI(k, 0, h - 1) * w + j;
      for (let k = -r; k <= r; k++) acc += inp[idx(k)];
      for (let i = 0; i < n; i++) {
        out[horiz ? j * w + i : i * w + j] = acc * inv;
        acc += inp[idx(i + r + 1)] - inp[idx(i - r)];
      }
    }
  };
  for (let k = 0; k < 3; k++) { pass(a, b, true); pass(b, a, false); }
  return a;
}
const clampI = (v, a, b) => v < a ? a : v > b ? b : v;
// apply a multiply texture within existing alpha (keeps the layer's silhouette)
function multiplyWithin(ctx, tex, sx = 0, sy = 0, alpha = 1) {
  const c = ctx.canvas, keep = makeCanvas(c.width, c.height), k = ctxOf(keep);
  k.drawImage(c, 0, 0);
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(tex, sx, sy, c.width, c.height, 0, 0, c.width, c.height);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'destination-in'; ctx.drawImage(keep, 0, 0);
  ctx.restore();
}

// ───────────────────────────────────────────── single-stroke hand lettering
// Each glyph is drawn on a 4×6 grid as polylines; materials decide the hand:
// pencil, thread, gouge, burin, chalk-white cyanotype pencil.
const GLYPHS = {
  A: [[0, 6, 2, 0, 4, 6], [0.8, 3.9, 3.2, 3.9]],
  B: [[0, 6, 0, 0, 2.7, 0, 3.7, 0.8, 3.7, 2.2, 2.7, 3, 0, 3], [2.7, 3, 4, 3.9, 4, 5.1, 3, 6, 0, 6]],
  C: [[4, 1, 3, 0, 1, 0, 0, 1, 0, 5, 1, 6, 3, 6, 4, 5]],
  D: [[0, 0, 0, 6, 2.4, 6, 4, 4.4, 4, 1.6, 2.4, 0, 0, 0]],
  E: [[4, 0, 0, 0, 0, 6, 4, 6], [0, 3, 3, 3]],
  F: [[4, 0, 0, 0, 0, 6], [0, 3, 3, 3]],
  G: [[4, 1, 3, 0, 1, 0, 0, 1, 0, 5, 1, 6, 3, 6, 4, 5, 4, 3.4, 2.2, 3.4]],
  H: [[0, 0, 0, 6], [4, 0, 4, 6], [0, 3, 4, 3]],
  I: [[1, 0, 3, 0], [2, 0, 2, 6], [1, 6, 3, 6]],
  J: [[4, 0, 4, 5, 3, 6, 1, 6, 0, 5]],
  K: [[0, 0, 0, 6], [4, 0, 0, 3.7], [1.3, 2.6, 4, 6]],
  L: [[0, 0, 0, 6, 4, 6]],
  M: [[0, 6, 0, 0, 2, 3.6, 4, 0, 4, 6]],
  N: [[0, 6, 0, 0, 4, 6, 4, 0]],
  O: [[1, 0, 3, 0, 4, 1, 4, 5, 3, 6, 1, 6, 0, 5, 0, 1, 1, 0]],
  P: [[0, 6, 0, 0, 3, 0, 4, 1, 4, 2.4, 3, 3.4, 0, 3.4]],
  Q: [[1, 0, 3, 0, 4, 1, 4, 5, 3, 6, 1, 6, 0, 5, 0, 1, 1, 0], [2.6, 4.6, 4.2, 6.4]],
  R: [[0, 6, 0, 0, 3, 0, 4, 1, 4, 2.4, 3, 3.4, 0, 3.4], [2, 3.4, 4, 6]],
  S: [[4, 1, 3, 0, 1, 0, 0, 1, 0, 2.2, 1, 3, 3, 3, 4, 3.8, 4, 5, 3, 6, 1, 6, 0, 5]],
  T: [[0, 0, 4, 0], [2, 0, 2, 6]],
  U: [[0, 0, 0, 5, 1, 6, 3, 6, 4, 5, 4, 0]],
  V: [[0, 0, 2, 6, 4, 0]],
  W: [[0, 0, 1, 6, 2, 2.4, 3, 6, 4, 0]],
  X: [[0, 0, 4, 6], [4, 0, 0, 6]],
  Y: [[0, 0, 2, 3], [4, 0, 2, 3, 2, 6]],
  Z: [[0, 0, 4, 0, 0, 6, 4, 6]],
  0: [[1, 0, 3, 0, 4, 1, 4, 5, 3, 6, 1, 6, 0, 5, 0, 1, 1, 0]],
  1: [[0.8, 1.3, 2, 0, 2, 6], [1, 6, 3, 6]],
  2: [[0, 1, 1, 0, 3, 0, 4, 1, 4, 2.4, 0, 6, 4, 6]],
  3: [[0, 1, 1, 0, 3, 0, 4, 1, 4, 2, 3, 3, 1.6, 3], [3, 3, 4, 4, 4, 5, 3, 6, 1, 6, 0, 5]],
  4: [[3, 6, 3, 0, 0, 4.2, 4, 4.2]],
  5: [[4, 0, 0.4, 0, 0, 3, 2.8, 2.6, 4, 3.6, 4, 5, 3, 6, 1, 6, 0, 5]],
  6: [[3.6, 0.4, 2.6, 0, 1, 0, 0, 1.4, 0, 5, 1, 6, 3, 6, 4, 5, 4, 3.6, 3, 2.8, 1, 2.8, 0, 3.8]],
  7: [[0, 0, 4, 0, 1.4, 6]],
  8: [[1, 3, 0, 2, 0, 1, 1, 0, 3, 0, 4, 1, 4, 2, 3, 3, 1, 3, 0, 4, 0, 5, 1, 6, 3, 6, 4, 5, 4, 4, 3, 3]],
  9: [[4, 2.4, 3, 3.2, 1, 3.2, 0, 2.2, 0, 1, 1, 0, 3, 0, 4, 1, 4, 5, 3, 6, 1, 6, 0.4, 5.4]],
  '/': [[0, 6.3, 4, -0.3]],
  '-': [[0.8, 3, 3.2, 3]],
  '+': [[2, 1.4, 2, 4.6], [0.4, 3, 3.6, 3]],
  '|': [[2, 0, 2, 6]],
  '.': [[1.7, 5.7, 2.3, 6]],
  '·': [[1.7, 3, 2.3, 3]],
  '&': [[4, 6, 1, 2, 1, 1, 2, 0, 3, 1, 3, 2, 0, 4, 0, 5, 1, 6, 2.6, 6, 4, 4]],
};
// returns polylines in px; size = cap height. tracking in glyph units.
function textStrokes(str, x, y, size, tracking = 1.7, rnd = null, jitter = 0) {
  const k = size / 6, lines = []; let cx = x;
  for (const ch of str.toUpperCase()) {
    if (ch === ' ') { cx += (4 + tracking) * k * 0.8; continue; }
    const g = GLYPHS[ch]; if (!g) { cx += (4 + tracking) * k; continue; }
    for (const s of g) {
      const pl = [];
      for (let i = 0; i < s.length; i += 2) pl.push([cx + s[i] * k + (rnd ? (rnd() - 0.5) * jitter : 0), y + s[i + 1] * k + (rnd ? (rnd() - 0.5) * jitter : 0)]);
      lines.push(pl);
    }
    cx += (4 + tracking) * k;
  }
  return lines;
}
function textWidth(str, size, tracking = 1.7) {
  const k = size / 6; let w = 0;
  for (const ch of str.toUpperCase()) w += ch === ' ' ? (4 + tracking) * k * 0.8 : (4 + tracking) * k;
  return w - tracking * k;
}
// resample polyline at even spacing
function resample(pl, step) {
  const out = [pl[0]];
  for (let i = 1; i < pl.length; i++) {
    const a = pl[i - 1], b = pl[i], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const n = Math.max(1, Math.ceil(l / step));
    for (let j = 1; j <= n; j++) out.push(lerpPt(a, b, j / n));
  }
  return out;
}
// graphite pencil: several thin passes with grain gaps
function pencil(ctx, lines, rnd, color = 'rgba(60,58,66,0.55)', w = 1.1) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const pl of lines) {
    const pts = resample(pl, 1.6);
    for (let pass = 0; pass < 3; pass++) {
      ctx.beginPath();
      let pen = false;
      for (const p of pts) {
        const gap = rnd() < 0.12;
        const x = p[0] + (rnd() - 0.5) * w * 0.7, y = p[1] + (rnd() - 0.5) * w * 0.7;
        if (gap) { pen = false; continue; }
        if (!pen) { ctx.moveTo(x, y); pen = true; } else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color; ctx.lineWidth = w * (0.6 + rnd() * 0.5); ctx.stroke();
    }
  }
  ctx.restore();
}
// ───────────────────────────────────────────────────────────── the skeleton
// The robot is defined ONCE, in robot units (feet at y = 0, head top ≈ −1.07,
// x centred). A fixed oblique projection shows the front, the top and the right
// side of every block: light comes from the upper left, so top = light,
// front = middle, side = dark. Every material interprets these same faces.
const DEPTH = [0.27, -0.21];               // screen offset per unit of depth

function box(id, x, y, w, h, d, extra = {}) {
  const dx = DEPTH[0] * d, dy = DEPTH[1] * d;
  return Object.assign({
    id, kind: 'box', x, y, w, h, d,
    front: [[x, y], [x + w, y], [x + w, y + h], [x, y + h]],
    top: [[x, y], [x + dx, y + dy], [x + w + dx, y + dy], [x + w, y]],
    side: [[x + w, y], [x + w + dx, y + dy], [x + w + dx, y + h + dy], [x + w, y + h]],
  }, extra);
}

const FACE_TONE = { top: 0.12, front: 0.42, side: 0.78 };   // 0 = lit, 1 = dark
const PIVOT = [-0.005, -0.565];                               // neck top: head tilts here

const SKELETON = (() => {
  const parts = [
    box('plinth', -0.40, 0.03, 0.74, 0.12, 0.34, { group: 'ground' }),
    box('footL', -0.168, -0.055, 0.128, 0.055, 0.16, { group: 'body' }),
    box('legL', -0.150, -0.240, 0.094, 0.190, 0.10, { group: 'body' }),
    box('footR', 0.004, -0.055, 0.128, 0.055, 0.16, { group: 'body' }),
    box('legR', 0.020, -0.240, 0.094, 0.190, 0.10, { group: 'body' }),
    box('armL', -0.262, -0.498, 0.082, 0.200, 0.10, { group: 'body' }),
    box('handL', -0.268, -0.312, 0.094, 0.072, 0.11, { group: 'body' }),
    box('torso', -0.190, -0.510, 0.360, 0.290, 0.22, { group: 'body' }),

// faces in painter's order, with the semantic tone of each
function facesOf(filter) {

    if (filter && !filter(p)) continue;

  }

function silhouetteParts(group) { return SKELETON.parts.filter(p => group === undefined || p.group === group); }

// ───────────────────────────────────────────────────────────── idle motion
// All periodic in the 16-second loop, so the loop is seamless.
const LOOP = 16, BEAT = 2;
const BLINKS = [1.25, 5.62, 6.0, 10.35, 13.7];
const LOOKS = [ // pupil target per beat (in eye-radius units): the robot glances at each new world
  [0.30, 0.10], [0.36, -0.18], [-0.22, 0.12], [0.40, 0.22], [0.05, 0.28], [0.38, -0.05], [-0.18, -0.16], [0.30, 0.14]];
function idle(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  const tilt = (2.1 * Math.sin(TAU * t * 2 / LOOP + 0.5) + 0.9 * Math.sin(TAU * t * 3 / LOOP + 2.1)) * Math.PI / 180;
  let blink = 0;
  for (const b of BLINKS) { const d = t - b; if (d > -0.09 && d < 0.13) blink = Math.max(blink, d < 0 ? 1 - Math.abs(d) / 0.09 : 1 - d / 0.13); }
  blink = clamp(blink * 1.25);
  const beat = Math.floor(t / BEAT) % 8, tb = t - beat * BEAT;
  const prev = LOOKS[(beat + 7) % 8], cur = LOOKS[beat];
  const k = smooth(0.02, 0.14, tb);                      // quick saccade just after the cut
  const drift = 0.05 * Math.sin(TAU * t / LOOP * 5);
  const look = [lerp(prev[0], cur[0], k) + drift, lerp(prev[1], cur[1], k) + drift * 0.5];
  const glint = fract(t / LOOP);
  // each cut lands like a small jolt: the head pops up and settles (damped)
  const pop = 0.010 * Math.exp(-tb * 9) * Math.sin(Math.min(tb, 1) * 24);
  const bob = 0.0025 * Math.sin(TAU * t * 4 / LOOP) - pop;
  return { t, tilt, blink, look, glint, bob, beat, tb };
}

// ───────────────────────────────────────────────────────────── layout
function makeLayout(W, H, R) {
  const portrait = H > W * 1.05;
  let s, ox, oy;
  if (!portrait) {
    s = Math.min(H * 0.70 / 1.23, W * 0.62 / 0.86);
    ox = W * 0.5; oy = H * 0.865 - 0.15 * s;
  } else {
    s = Math.min(W * 0.86 / 0.86, H * 0.47 / 1.23);
    ox = W * 0.5; oy = H * 0.755 - 0.15 * s;
  }
  // everything below is in device pixels
  const S = s * R, OX = ox * R, OY = oy * R;
  const P = p => [OX + p[0] * S, OY + p[1] * S];
  const PP = pts => pts.map(P);
  const L = { W: W * R, H: H * R, R, s: S, ox: OX, oy: OY, P, PP, portrait,
    u: S / 500, // a unit that tracks the poster's scale
    m: Math.min(W, H) * R * 0.045, // print margin
  };
  // head crop (generous margin: tilt + fold tip + ear)
  const hb = bboxOf(PP([...SKELETON.head.top, ...SKELETON.head.front, ...SKELETON.head.side, SKELETON.fold.tip,
    [SKELETON.ear.cx + SKELETON.ear.rx * 1.6, SKELETON.ear.cy]]));
  const mg = 0.06 * S;
  L.headCrop = { x: Math.floor(hb.x0 - mg), y: Math.floor(hb.y0 - mg), w: Math.ceil(hb.w + mg * 2), h: Math.ceil(hb.h + mg * 2) };

  return L;
}
// ───────────────────────────────────────────── shared surfaces and helpers
const MATERIALS = [];
function defMaterial(m) { MATERIALS.push(m); }

// Paper: a low-frequency mottle (computed small, upscaled smooth), a full-res
// tooth, and fibres. Returns an opaque canvas of the paper colour.
function* makePaper(L, col, o = {}) {
  const { mottle = 0.06, tooth = 0.05, fibres = 260, fibreCol = null, seed = 1, warm = 0 } = o;
  const W = L.W, H = L.H, c = makeCanvas(W, H), ctx = ctxOf(c);
  const sw = Math.ceil(W / 6), sh = Math.ceil(H / 6), small = makeCanvas(sw, sh);
  const base = hexRGB(col);
  yield* fieldToCanvas(small, (x, y) => {
    const n = fbm(x / 34, y / 34, 4, seed) - 0.5, n2 = fbm(x / 9, y / 9, 2, seed + 5) - 0.5;
    const k = n * mottle * 2.2 + n2 * mottle * 0.8;
    return [base[0] * (1 + k) + warm * n, base[1] * (1 + k), base[2] * (1 + k) - warm * n];
  });

  ctx.drawImage(small, 0, 0, W, H);
  // tooth: fine speckle via ImageData
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  yield* pixelRows(H, y => {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const g = (hash2(x, y, seed + 99) - 0.5) * tooth * 255 + (vnoise(x / 2.3, y / 2.3, seed + 3) - 0.5) * tooth * 180;
      d[i] += g; d[i + 1] += g; d[i + 2] += g;

  ctx.putImageData(img, 0, 0);
  // fibres
  const rnd = mulberry32(seed * 7 + 3), fc = fibreCol ? hexRGB(fibreCol) : shadeRGB(base, -0.12);
  ctx.lineCap = 'round';
  const n = Math.round(fibres * W * H / (1440 * 900));
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = rnd() * H, a = rnd() * TAU, l = (6 + rnd() * 22) * L.u;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(a + 0.6) * l * 0.5, y + Math.sin(a + 0.6) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l);
    const light = rnd() < 0.5;
    ctx.strokeStyle = light ? rgba(shadeRGB(base, 0.35), 0.35) : rgba(fc, 0.22);
    ctx.lineWidth = (0.5 + rnd() * 0.7) * L.u; ctx.stroke();
  }
  return c;
}

// wobbly edges in device px for a polygon given in robot units
function facePx(L, pts, rnd, step = 7, amp = 1.4) { return wobble(L.PP(pts), step * L.u, amp * L.u, rnd); }

// a soft drop shadow shape (blurred) drawn onto ctx
// rendered in a canvas the size of the shape, so the blur never touches the whole frame
function softShadow(ctx, pts, color, blur) {
  const bb = bboxOf(pts), m = Math.ceil(blur * 2.5), k = blur > 6 ? 0.5 : 1;
  const w = Math.ceil((bb.w + m * 2) * k), h = Math.ceil((bb.h + m * 2) * k);
  if (w < 1 || h < 1) return;
  const c = makeCanvas(w, h), x = ctxOf(c);
  x.filter = `blur(${Math.max(0.5, blur * k)}px)`;
  x.scale(k, k); x.translate(-bb.x0 + m, -bb.y0 + m); fillPoly(x, pts, color);
  ctx.drawImage(c, bb.x0 - m, bb.y0 - m, w / k, h / k);

// edition mark in the corner: "3/8  LINOCUT" left, "PAPER ROBOTS" right
function editionLayout(L, size) {
  const m = L.m, y = L.H - m - size;
  return { left: [m, y], right: [L.W - m, y], size };

// Stroke polylines with a gouache brush (used by the painted look)
function brushStroke(ctx, pl, w, col, alpha, rnd) {
  const pts = resample(pl, Math.max(2, w * 0.4));
  for (let pass = 0; pass < 3; pass++) {
    ctx.beginPath();
    pts.forEach((p, i) => { const x = p[0] + (rnd() - 0.5) * w * 0.25, y = p[1] + (rnd() - 0.5) * w * 0.25; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });

// a wide blur done small: draw down, blur, draw back up (cheap, and soft anyway)

// ═════════════════════════════════════════ 1 · PAINTED — the Paper Robots look
// Gouache on cream paper. Opaque cobalt laid in directional strokes; pigment
// pools at the edge of every face; dry-brush lets the paper show through.
defMaterial({
  key: 'painted', label: 'GOUACHE', field: '#efe3c8',
  pal: {
    paper: '#efe3c8', cobalt: '#2a4db4', cobaltTop: '#5a80d8', cobaltSide: '#172e80', ink: '#191b2b',
    eye: '#f8f1df', eyeShade: '#d8c39b', ver: '#e3492a', verDark: '#a52d18', sun: '#f2bc4e', sunEdge: '#e19a2c',
    stoneTop: '#eed6a2', stone: '#d9b070', stoneSide: '#b4864a', leaf: '#5f7d33', leafDark: '#3d5821', petal: '#f3b62e', seed: '#3f2412',
    hill: '#7c93d2', hillTop: '#a8bae6', hillSide: '#5f75bb', ground: '#e8d3a0',
  },
  *build(L, out) {
    const P = this.pal, rnd = mulberry32(11), u = L.u;
    const paper = yield* makePaper(L, P.paper, { mottle: 0.05, tooth: 0.05, fibres: 240, seed: 3, warm: 6 });
    out.paperTex = paper;
    const base = makeCanvas(L.W, L.H), b = ctxOf(base);
    b.drawImage(paper, 0, 0);
    const hy = L.P([0, -0.02])[1];

    // sun disc: a flat coat with a darker tide-line where the wash dried
    const sun = SKELETON.sun, [scx, scy] = L.P([sun.cx, sun.cy]), sr = sun.r * L.s;
    const sunPts = wobble(ellipsePts(scx, scy, sr, sr, 140), 9 * u, 2.4 * u, rnd);
    paintFace(b, sunPts, hexRGB(P.sun), { angle: 0.1, rnd, u, strokes: 260, var: 0.05, edge: hexRGB(P.sunEdge), edgeW: 9, granule: 0.35, bristle: 0.7 });
    yield;
    // distant hills: a pale cobalt wash laid wet, so its top edge blooms soft
    for (const [x0, x1, hgt, seed, k] of [[-0.2, 0.42, 0.13, 31, 0.62], [0.55, 1.2, 0.17, 37, 0.55], [0.18, 0.86, 0.08, 39, 0.72]]) {
      const r2 = mulberry32(seed), pts = [[x0 * L.W, hy + 2]];
      for (let i = 0; i <= 40; i++) { const t2 = i / 40; pts.push([lerp(x0, x1, t2) * L.W, hy - hgt * L.s * Math.pow(Math.sin(Math.PI * t2), 0.8) * (0.8 + 0.25 * fbm(t2 * 4, seed, 2, seed))]); }
      pts.push([x1 * L.W, hy + 2]);
      const c = mixRGB(hexRGB(P.hill), hexRGB(P.paper), k);
      b.save(); b.filter = `blur(${3 * u}px)`; fillPoly(b, pts, rgba(c, 0.9)); b.restore();
      paintFace(b, pts, c, { angle: 0.05, rnd, u, strokes: 60, var: 0.05, edge: shadeRGB(c, -0.08), edgeW: 6, granule: 0.6, blotch: 0.8, alpha: 0.75 });
    }
    yield;
    // the ground plane, lighter towards the horizon
    const ground = [[-10, hy], [L.W + 10, hy], [L.W + 10, L.H + 10], [-10, L.H + 10]];
    paintFace(b, ground, hexRGB(P.ground), { angle: 0.0, rnd, u, strokes: 420, var: 0.05, edge: hexRGB(P.ground), edgeW: 0.1, granule: 0.6, blotch: 1.5 });
    b.save(); const gg = b.createLinearGradient(0, hy, 0, L.H);
    gg.addColorStop(0, 'rgba(239,227,200,0.55)'); gg.addColorStop(0.35, 'rgba(239,227,200,0)'); gg.addColorStop(1, 'rgba(170,120,60,0.18)');
    b.fillStyle = gg; b.fillRect(0, hy, L.W, L.H - hy); b.restore();
    for (let i = 0; i < 70; i++) { // a few long, soft field strokes
      const yy = hy + Math.pow(rnd(), 1.4) * (L.H - hy), x = rnd() * L.W, k = (yy - hy) / (L.H - hy);
      brushStroke(b, [[x, yy], [x + (40 + rnd() * 160) * u * (0.3 + k), yy + (rnd() - 0.5) * 2 * u]], (2 + rnd() * 5) * u * (0.4 + k), shadeRGB(hexRGB(P.ground), -0.06 - rnd() * 0.08), 0.22, rnd);
    }

    const plinth = SKELETON.parts[0];

    softShadow(b, L.PP([[-0.17, -0.005], [0.13, -0.005], [0.32, -0.045], [0.03, -0.045]]), 'rgba(110,70,30,0.34)', 5 * u);
    // sunflowers at the foot of the plinth
    sunflower(b, L, P, -0.60, 0.25, 0.36, 1.25, mulberry32(21));
    sunflower(b, L, P, -0.74, 0.30, 0.26, 1.0, mulberry32(22));

    const wm = 'PAPER ROBOTS', ww = textWidth(wm, E.size);
    pencil(b, textStrokes(wm, E.right[0] - ww, E.right[1], E.size, 1.7, rnd, 0.4 * u), rnd, 'rgba(70,62,60,0.6)', 1.1 * u);

  glint(ctx, c, L, st) {
    const e = SKELETON.ear, [cx, cy] = L.P([e.cx, e.cy]);
    const a = st.glint * TAU, rx = e.rx * L.s, ry = e.ry * L.s;

    ctx.restore();
  },
});

// fill a polygon (device px) as an opaque gouache coat
function paintFace(ctx, pts, col, o) {

  // 1 · soft blotches: the coat was laid in two or three loads of paint
  const nb = Math.round((4 + rnd() * 6) * blotch);
  for (let i = 0; i < nb; i++) {
    const r = (0.18 + rnd() * 0.4) * diag, x = bb.x0 + rnd() * bb.w, y = bb.y0 + rnd() * bb.h;

  }

  const nd = Math.round(Math.min(900, (bb.w * bb.h) / (90 * u * u)) * blotch * 0.5);
  for (let i = 0; i < nd; i++) {
    const x = bb.x0 + rnd() * bb.w, y = bb.y0 + rnd() * bb.h, r = (3 + rnd() * 9) * u;
    ctx.beginPath(); ctx.ellipse(x, y, r, r * (0.35 + rnd() * 0.4), angle + (rnd() - 0.5) * 0.8, 0, TAU);
    ctx.fillStyle = rgba(shadeRGB(col, (rnd() - 0.5) * 2 * vr * 1.8), 0.16 + rnd() * 0.14); ctx.fill();
  }
  // 2 · bristle strokes: each stroke is a bundle of hairs that thin out
  const area = (bb.w * bb.h) / (160000 * u * u);
  const n = Math.round(strokes * Math.min(1.6, Math.max(0.2, area)) * bristle);
  const ca = Math.cos(angle), sa = Math.sin(angle);
  ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {

    const w = (5 + rnd() * 12) * u, k = (rnd() - 0.5) * 2 * vr, hairs = 5 + (rnd() * 5 | 0);

  // 4 · pigment pooled along the edge as it dried
  ctx.lineJoin = 'round';
  for (const [k, a] of [[2.2, 0.16], [1.5, 0.2], [0.9, 0.26], [0.45, 0.3]]) {
    ctx.beginPath(); polyPath(ctx, pts); ctx.strokeStyle = rgba(edge, a); ctx.lineWidth = edgeW * u * k; ctx.stroke();
  }
  ctx.beginPath(); polyPath(ctx, pts); ctx.strokeStyle = rgba(edge, 0.35); ctx.lineWidth = 1.1 * u; ctx.stroke();
  // 5 · granulation: pigment settles in the paper's pits
  const g = Math.round(n * 4 * granule);
  for (let i = 0; i < g; i++) {
    const x = bb.x0 + rnd() * bb.w, y = bb.y0 + rnd() * bb.h;
    ctx.fillStyle = rnd() < 0.65 ? rgba(shadeRGB(col, -0.35), 0.28) : rgba(shadeRGB(col, 0.35), 0.22);
    const s = (0.5 + rnd() * 1.3) * u; ctx.fillRect(x, y, s, s);
  }
  ctx.restore();
}

function paintBlock(ctx, L, p, P, rnd, isHead = false) {
  const cols = { top: hexRGB(P.cobaltTop), front: hexRGB(P.cobalt), side: hexRGB(P.cobaltSide) };
  const angle = { top: -0.2, front: 0.12, side: 1.25 };
  for (const f of ['side', 'top', 'front']) {
    let pts = p[f];
    paintFace(ctx, wobble(insetPoly(L.PP(pts), 1.1 * L.u), 6 * L.u, 1.2 * L.u, rnd), cols[f], { angle: angle[f] + (rnd() - 0.5) * 0.3, rnd, u: L.u, strokes: isHead ? 520 : 200, var: 0.08, edge: shadeRGB(cols[f], -0.35), edgeW: isHead ? 6 : 4, granule: 0.9 });
  }
  // paper edge catching light on the top-front edge
  const e = L.PP([p.front[0], p.front[1]]);
  ctx.save(); ctx.setLineDash([12 * L.u, 3 * L.u, 30 * L.u, 4 * L.u]);
  ctx.beginPath(); ctx.moveTo(e[0][0], e[0][1]); ctx.lineTo(e[1][0], e[1][1]);
  ctx.strokeStyle = rgba(hexRGB('#9fb6ec'), 0.55); ctx.lineWidth = 1.6 * L.u; ctx.stroke(); ctx.restore();
}

function paintFold(ctx, L, P, rnd) {
  const F = SKELETON.fold, u = L.u;
  // the uncovered corner shows the inside of the head: deep shadow
  fillPoly(ctx, L.PP(F.gone), rgba(hexRGB('#0f1d55'), 1));
  // the lifted flap throws a small shadow down and to the right
  softShadow(ctx, L.PP(F.flap).map(p => [p[0] + 3 * u, p[1] + 5 * u]), 'rgba(8,16,60,0.55)', 3 * u);
  const flap = facePx(L, F.flap, rnd, 5, 0.8);
  paintFace(ctx, flap, hexRGB(P.eye), { angle: 0.8, rnd, u, strokes: 90, var: 0.04, edge: hexRGB(P.eyeShade), edgeW: 5, granule: 0.3 });
  // shade the half of the flap nearest the hinge
  const [A, T, B] = L.PP(F.flap), M = lerpPt(A, B, 0.5);
  ctx.save(); ctx.beginPath(); polyPath(ctx, flap); ctx.clip();
  const g = ctx.createLinearGradient(M[0], M[1], T[0], T[1]);
  g.addColorStop(0, 'rgba(160,130,90,0.38)'); g.addColorStop(0.55, 'rgba(160,130,90,0.0)');
  ctx.fillStyle = g; ctx.fillRect(Math.min(A[0], T[0], B[0]) - 5, Math.min(A[1], T[1]) - 5, 400 * u, 400 * u);
  ctx.restore();
  // crease
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]);
  ctx.strokeStyle = 'rgba(30,40,90,0.55)'; ctx.lineWidth = 1.4 * u; ctx.stroke();
}

function paintEar(ctx, L, P, rnd) {
  const e = SKELETON.ear, [cx, cy] = L.P([e.cx, e.cy]), rx = e.rx * L.s, ry = e.ry * L.s, rim = e.rim * L.s, u = L.u;
  // disc thickness (rim) then the face
  const rimPts = wobble(ellipsePts(cx - rim, cy + rim * 0.15, rx, ry, 60), 5 * u, 0.8 * u, rnd);
  paintFace(ctx, rimPts, hexRGB(P.verDark), { angle: 1.4, rnd, u, strokes: 60, var: 0.05, edge: hexRGB('#7c2010'), edgeW: 3, granule: 0.6 });
  const facePts = wobble(ellipsePts(cx, cy, rx, ry, 60), 5 * u, 0.8 * u, rnd);
  paintFace(ctx, facePts, hexRGB(P.ver), { angle: 1.2, rnd, u, strokes: 90, var: 0.07, edge: hexRGB('#b8341c'), edgeW: 4, granule: 0.6 });
  // concentric pressed ring
  ctx.beginPath(); ctx.ellipse(cx, cy, rx * 0.62, ry * 0.62, 0, 0, TAU);
  ctx.strokeStyle = 'rgba(140,35,15,0.35)'; ctx.lineWidth = 1.4 * u; ctx.stroke();
}

function paintEyeWhite(ctx, cx, cy, r, P, rnd, u) {
  const pts = wobble(ellipsePts(cx, cy, r, r, 64), 4 * u, 0.9 * u, rnd);
  paintFace(ctx, pts, hexRGB(P.eye), { angle: 0.3, rnd, u, strokes: 50, var: 0.03, edge: hexRGB(P.eyeShade), edgeW: 5, granule: 0.2 });
  // lower-left shading: the eye is a slightly domed disc
  ctx.save(); ctx.beginPath(); polyPath(ctx, pts); ctx.clip();
  const g = ctx.createRadialGradient(cx + r * 0.35, cy - r * 0.35, r * 0.2, cx, cy, r * 1.1);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(170,140,95,0.45)');
  ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2); ctx.restore();
}

function sunflower(ctx, L, P, x, y, h, scale, rnd) {
  const u = L.u, [bx, by] = L.P([x, y]), top = L.P([x + 0.03, y - h]);
  const mid = [lerp(bx, top[0], 0.5) - 8 * u * scale, lerp(by, top[1], 0.5)];
  // stem: a loaded stroke, darker on the shaded side
  brushStroke(ctx, [[bx, by + 0.06 * L.s], mid, top], 6 * u * scale, hexRGB(P.leaf), 0.95, rnd);
  brushStroke(ctx, [[bx + 2 * u, by + 0.06 * L.s], [mid[0] + 2 * u, mid[1]], [top[0] + 2 * u, top[1]]], 2.2 * u * scale, hexRGB(P.leafDark), 0.8, rnd);
  for (let i = 0; i < 3; i++) {   // broad heart-shaped leaves
    const t = 0.28 + i * 0.22, px = lerp(bx, top[0], t), py = lerp(by, top[1], t), dir = i % 2 ? 1 : -1;
    const lw = (34 + rnd() * 10) * u * scale, lh = 15 * u * scale;
    ctx.save(); ctx.translate(px, py); ctx.rotate(dir > 0 ? -0.55 - rnd() * 0.3 : Math.PI + 0.55 + rnd() * 0.3);
    const pts = []; for (let k = 0; k <= 24; k++) { const a = k / 24; pts.push([a * lw, -Math.pow(Math.sin(a * Math.PI), 0.8) * lh * (1 - a * 0.3)]); }
    for (let k = 24; k >= 0; k--) { const a = k / 24; pts.push([a * lw, Math.pow(Math.sin(a * Math.PI), 0.8) * lh * 0.55 * (1 - a * 0.3)]); }
    paintFace(ctx, pts, hexRGB(i === 1 ? P.leafDark : P.leaf), { angle: 0.2, rnd, u, strokes: 26, var: 0.1, edgeW: 3, granule: 0.5, blotch: 0.5 });
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(lw * 0.5, -lh * 0.15, lw * 0.92, -lh * 0.05); ctx.strokeStyle = 'rgba(40,60,20,0.6)'; ctx.lineWidth = 1 * u; ctx.stroke();
    ctx.restore();
  }
  const R = 20 * u * scale;
  for (let ring = 0; ring < 2; ring++) {      // petals, each its own touch of paint
    const n = 16 + ring * 4;
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU + ring * 0.17 + rnd() * 0.12, l = R * (1.05 + rnd() * 0.3 - ring * 0.15);
      ctx.save(); ctx.translate(top[0], top[1]); ctx.rotate(a);
      const pts = [];
      for (let k = 0; k <= 10; k++) { const t = k / 10; pts.push([R * 0.5 + l * t, -Math.sin(Math.PI * Math.pow(t, 0.8)) * l * 0.2]); }
      for (let k = 10; k >= 0; k--) { const t = k / 10; pts.push([R * 0.5 + l * t, Math.sin(Math.PI * Math.pow(t, 0.8)) * l * 0.2]); }
      const col = shadeRGB(hexRGB(P.petal), ring ? -0.12 - rnd() * 0.12 : (rnd() - 0.3) * 0.16);
      fillPoly(ctx, pts, rgba(col));
      ctx.beginPath(); polyPath(ctx, pts); ctx.strokeStyle = rgba(shadeRGB(col, -0.25), 0.55); ctx.lineWidth = 0.9 * u; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(R * 0.55, 0); ctx.lineTo(R * 0.5 + l * 0.75, (rnd() - 0.5) * 2 * u); ctx.strokeStyle = 'rgba(200,120,20,0.45)'; ctx.lineWidth = 1 * u; ctx.stroke();
      ctx.restore();
    }
  }
  ctx.beginPath(); ctx.arc(top[0], top[1], R * 0.66, 0, TAU); ctx.fillStyle = P.seed; ctx.fill();
  for (let i = 0; i < 110; i++) {             // the seed spiral
    const a = i * 2.39996, rr = Math.sqrt(i / 110) * R * 0.62;
    ctx.fillStyle = i % 3 ? 'rgba(130,78,32,0.75)' : 'rgba(20,10,5,0.75)';
    ctx.beginPath(); ctx.arc(top[0] + Math.cos(a) * rr, top[1] + Math.sin(a) * rr, 1.1 * u, 0, TAU); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(top[0] - R * 0.15, top[1] - R * 0.18, R * 0.3, 0, TAU); ctx.fillStyle = 'rgba(255,200,120,0.12)'; ctx.fill();
}
// ═════════════════════════════════════════ 2 · CYANOTYPE — a sun-print photogram
// Paper brushed with iron salts, the robot laid on it as a paper cut-out, ferns
// beside it, exposed to the sun and washed. Where the cut-out blocked the
// light the paper stays white; thin tissue lets some through (pale blue); the
// eyes are holes (deep blue) with paper pupils dropped in. Edges lift off the
// paper and blur. The emulsion was brushed on, so its border is ragged.
defMaterial({
  key: 'cyanotype', label: 'CYANOTYPE', field: '#14387f',
  pal: { paper: '#f3f0e5', mid: '#4a78bb', deep: '#0f2c6c', stain: '#d9dcc4' },
  *build(L, out) {
    const P = this.pal, rnd = mulberry32(202), u = L.u, W = L.W, H = L.H;
    const m = L.m * 1.1;
    // ── emulsion: a brushed rectangle with streaky, ragged ends
    const em = makeCanvas(W, H), e = ctxOf(em);
    e.fillStyle = '#000'; e.fillRect(0, 0, W, H);
    const top = m, bot = H - m * 1.95, left = m, right = W - m;
    e.fillStyle = '#fff'; e.fillRect(left + 80 * u, top + 22 * u, right - left - 160 * u, bot - top - 44 * u);
    e.lineCap = 'round';
    const rows = Math.ceil((bot - top) / (20 * u));
    for (let i = 0; i <= rows; i++) {           // horizontal brush passes, each a bundle of hairs
      const t = i / rows, y = lerp(top + 6 * u, bot - 6 * u, t) + (rnd() - 0.5) * 6 * u;
      const edgeRow = t < 0.04 || t > 0.96;
      const xs = left + (fbm(t * 5, 1, 2, 5) - 0.5) * 44 * u + 26 * u, xe = right - (fbm(t * 5, 9, 2, 6) - 0.5) * 44 * u - 26 * u;
      const w = (22 + rnd() * 12) * u, hairs = 18;
      for (let hI = 0; hI < hairs; hI++) {
        const off = (hI / (hairs - 1) - 0.5) * w, yy = y + off;
        const a0 = xs - Math.pow(rnd(), 3) * 18 * u + rnd() * 8 * u, a1 = xe + Math.pow(rnd(), 3) * 18 * u - rnd() * 10 * u;
        const al = (edgeRow ? 0.25 : 0.5) + rnd() * 0.45, lw = w / hairs * (0.8 + rnd() * 1.0);
        e.strokeStyle = `rgba(255,255,255,${al})`; e.lineWidth = lw;
        e.beginPath(); e.moveTo(a0 + 30 * u, yy); e.lineTo(a1 - 30 * u, yy + (rnd() - 0.5) * 3 * u); e.stroke();
        // the bristles run dry at both ends: broken, fading marks
        for (const [from, dir] of [[a0 + 30 * u, -1], [a1 - 30 * u, 1]]) {
          let x = from;
          while (Math.abs(x - from) < 26 * u) {
            const seg = (2 + rnd() * 10) * u, gap = (1 + rnd() * 6) * u * (1 + Math.abs(x - from) / (14 * u));
            e.globalAlpha = Math.max(0, 1 - Math.abs(x - from) / (26 * u));
            e.beginPath(); e.moveTo(x, yy); e.lineTo(x + dir * seg, yy + (rnd() - 0.5) * u); e.stroke();
            x += dir * (seg + gap);
          }
          e.globalAlpha = 1;
        }
      }
    }
    yield;
    // ── object masks (white = blocks light). screen = layers add up.
    const objW = makeCanvas(W, H), o = ctxOf(objW), objH = makeCanvas(W, H), oh = ctxOf(objH);
    for (const c of [o, oh]) { c.fillStyle = '#000'; c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'screen'; }
    const g = v => { const k = Math.round(v * 255); return `rgb(${k},${k},${k})`; };
    // sun: a round of tracing paper — fibrous, partly translucent
    const sun = SKELETON.sun, [scx, scy] = L.P([sun.cx, sun.cy]), sr = sun.r * L.s;
    o.beginPath(); polyPath(o, wobble(ellipsePts(scx, scy, sr, sr, 160), 6 * u, 1.2 * u, rnd)); o.fillStyle = g(0.42); o.fill();
    o.save(); o.beginPath(); o.arc(scx, scy, sr, 0, TAU); o.clip();
    for (let i = 0; i < 900; i++) { // fibres in the tracing paper
      const x = scx + (rnd() - 0.5) * 2 * sr, y = scy + (rnd() - 0.5) * 2 * sr, a = rnd() * TAU, l = (4 + rnd() * 16) * u;
      o.beginPath(); o.moveTo(x, y); o.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); o.strokeStyle = g(0.10 + rnd() * 0.12); o.lineWidth = (0.6 + rnd()) * u; o.stroke();
    }
    o.restore();
    // ferns and grasses (Atkins would approve), laid either side
    fern(o, L, [-0.50, 0.16], -1.25, 0.95, mulberry32(7), g);
    fern(o, L, [-0.64, 0.16], -1.75, 0.70, mulberry32(8), g);
    fern(o, L, [0.48, 0.16], -1.85, 0.88, mulberry32(9), g);
    grass(o, L, [0.66, 0.16], mulberry32(10), g);
    grass(o, L, [-0.82, 0.16], mulberry32(12), g);
    yield;
    // plinth: thick card
    const pl = SKELETON.parts[0];
    for (const [f, v] of [['front', 0.97], ['top', 0.80], ['side', 0.99]]) {
      o.beginPath(); polyPath(o, insetPoly(L.PP(pl[f]), -1.2 * u)); o.fillStyle = g(v); o.fill();
    }
    // the robot is cut from three papers: tissue (top faces), cartridge (fronts), card (sides)
    const OP = { top: 0.62, front: 0.90, side: 0.985 };
    const drawPart = (c, p) => { for (const f of ['side', 'top', 'front']) { c.beginPath(); polyPath(c, wobble(insetPoly(L.PP(p[f]), -1.4 * u), 8 * u, 0.8 * u, rnd)); c.fillStyle = g(OP[f]); c.fill(); } };
    for (const p of SKELETON.parts) if (p.group === 'body') drawPart(o, p);
    drawPart(oh, SKELETON.head);
    // fold: a doubled layer of paper — whiter
    oh.beginPath(); polyPath(oh, L.PP(SKELETON.fold.flap)); oh.fillStyle = g(0.9); oh.fill();
    // ear: a hole in the card covered with red cellophane — half the light gets through
    const ear = SKELETON.ear, [ex, ey] = L.P([ear.cx, ear.cy]);
    oh.globalCompositeOperation = 'source-over';
    oh.beginPath(); oh.ellipse(ex, ey, ear.rx * L.s, ear.ry * L.s, 0, 0, TAU); oh.fillStyle = g(0.42); oh.fill();
    oh.beginPath(); oh.ellipse(ex, ey, ear.rx * L.s * 0.55, ear.ry * L.s * 0.55, 0, 0, TAU); oh.strokeStyle = g(0.62); oh.lineWidth = 1.6 * u; oh.stroke();
    oh.beginPath(); oh.ellipse(ex, ey, ear.rx * L.s, ear.ry * L.s, 0, 0, TAU); oh.strokeStyle = g(0.8); oh.lineWidth = 2 * u; oh.stroke();
    yield;

    // ── expose and wash, per pixel
    const blurCopy = (src, r) => { const c = makeCanvas(W, H), x = ctxOf(c); x.filter = `blur(${r}px)`; x.drawImage(src, 0, 0); return readGray(c); };
    const E = blurCopy(em, 1.5 * u); yield;
    const Ow1 = blurCopy(objW, 1.0 * u); yield;
    const Ow2 = blurCopy(objW, 5 * u); yield;
    const Oh1 = blurCopy(objH, 1.0 * u); yield;
    const Oh2 = blurCopy(objH, 4.5 * u); yield;
    const Hm = blurCopy(objH, 0.5 * u); yield;
    const pap = hexRGB(P.paper), mid = hexRGB(P.mid), deep = hexRGB(P.deep), stain = hexRGB(P.stain);
    const lift = (x, y) => smooth(0.35, 0.75, fbm(x / (160 * u), y / (160 * u), 2, 31)); // where the cut-out lifted
    const colorAt = (x, y, Ex, O) => {
      const streak = fbm(x / (220 * u), y / (9 * u), 3, 44) - 0.5, blot = fbm(x / (60 * u), y / (60 * u), 3, 45) - 0.5;
      const tooth = hash2(x, y, 9) - 0.5;
      const X = Ex * (1 - O);
      let D = 1 - Math.exp(-3.2 * X * (1 + streak * 0.35 + blot * 0.25));
      D = clamp(D * (0.94 + tooth * 0.12) + Ex * 0.05);
      let c;
      if (D < 0.5) c = mixRGB(Ex > 0.2 ? mixRGB(pap, stain, 0.25 * Ex * (1 - D * 2)) : pap, mid, smooth(0.02, 0.5, D));
      else c = mixRGB(mid, deep, smooth(0.5, 0.97, D));
      return c;
    };
    const base = makeCanvas(W, H);
    const paper = yield* makePaper(L, P.paper, { mottle: 0.03, tooth: 0.07, fibres: 200, seed: 21 });
    const pd = ctxOf(paper).getImageData(0, 0, W, H).data;
    const bctx = ctxOf(base), img = bctx.createImageData(W, H), d = img.data;
    yield* pixelRows(H, y => {
      for (let x = 0; x < W; x++) {
        const i = y * W + x, k = lift(x, y), O = lerp(Ow1[i], Ow2[i], k);
        const c = colorAt(x, y, E[i], O), pt = pd[i * 4] / pap[0];
        d[i * 4] = c[0] * pt; d[i * 4 + 1] = c[1] * pt; d[i * 4 + 2] = c[2] * pt; d[i * 4 + 3] = 255;
      }
    });
    bctx.putImageData(img, 0, 0);
    // pencil on the white margin
    const E2 = editionLayout(L, 9 * u);
    pencil(bctx, textStrokes('2/8  CYANOTYPE', E2.left[0], E2.left[1], E2.size, 1.7, rnd, 0.4 * u), rnd, 'rgba(70,70,80,0.6)', 1.1 * u);
    const wm = 'PAPER ROBOTS', ww = textWidth(wm, E2.size);
    pencil(bctx, textStrokes(wm, E2.right[0] - ww, E2.right[1], E2.size, 1.7, rnd, 0.4 * u), rnd, 'rgba(70,70,80,0.6)', 1.1 * u);
    out.base = base;
    yield;
    // head layer: same exposure with the head's cut-out added, alpha = head mask
    const C = L.headCrop, head = makeCanvas(C.w, C.h), hc = ctxOf(head), himg = hc.createImageData(C.w, C.h), hd = himg.data;
    for (let y = 0; y < C.h; y++) for (let x = 0; x < C.w; x++) {
      const X = x + C.x, Y = y + C.y; if (X < 0 || Y < 0 || X >= W || Y >= H) continue;
      const i = Y * W + X, k = lift(X, Y);
      const oh = lerp(Oh1[i], Oh2[i], k * 0.7), ow = lerp(Ow1[i], Ow2[i], k);
      const a = clamp(Hm[i] * 4);
      if (a <= 0) continue;
      const O = 1 - (1 - oh) * (1 - ow);
      const c = colorAt(X, Y, E[i], O), pt = pd[i * 4] / pap[0], j = (y * C.w + x) * 4;
      hd[j] = c[0] * pt; hd[j + 1] = c[1] * pt; hd[j + 2] = c[2] * pt; hd[j + 3] = a * 255;
    }
    hc.putImageData(himg, 0, 0);
    out.head = head;
    // the eyes are holes: the light came through them
    out.eyeWhite = (c, cx, cy, r) => {
      c.filter = `blur(${1.2 * u}px)`;
      c.beginPath(); c.arc(cx, cy, r * 0.97, 0, TAU); c.fillStyle = rgba(mixRGB(mid, deep, 0.55)); c.fill();
      c.filter = 'none';
      for (let i = 0; i < 160; i++) { const a = rnd() * TAU, rr = Math.sqrt(rnd()) * r * 0.9; c.fillStyle = rnd() < 0.5 ? 'rgba(10,30,90,0.25)' : 'rgba(110,150,210,0.18)'; c.fillRect(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1.2 * u, 1.2 * u); }
    };
    // pupils: little paper dots, slightly soft where they lift
    out.pupil = (c, cx, cy, r) => { c.filter = `blur(${0.9 * u}px)`; c.beginPath(); c.arc(cx, cy, r * 0.92, 0, TAU); c.fillStyle = rgba(mixRGB(pap, mid, 0.08)); c.fill(); c.filter = 'none'; };
    out.lidCol = rgba(mixRGB(mid, pap, 0.3), 0.9);
  },
});

function fern(ctx, L, at, ang, len, rnd, g) {
  const u = L.u, [x0, y0] = L.P(at), Ls = len * L.s * 0.55;
  const bend = (rnd() - 0.5) * 0.9;
  const pt = t => { const a = ang + bend * t; return [x0 + Math.cos(ang) * Ls * t + Math.cos(a + Math.PI / 2) * bend * Ls * 0.25 * t * t, y0 + Math.sin(ang) * Ls * t + Math.sin(a + Math.PI / 2) * bend * Ls * 0.25 * t * t]; };
  ctx.beginPath(); for (let i = 0; i <= 40; i++) { const p = pt(i / 40); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  ctx.strokeStyle = g(0.95); ctx.lineWidth = 2.4 * u; ctx.lineCap = 'round'; ctx.stroke();
  const n = 22;
  for (let i = 2; i < n; i++) {
    const t = i / n, p = pt(t), q = pt(t + 0.01), da = Math.atan2(q[1] - p[1], q[0] - p[0]);
    for (const side of [-1, 1]) {
      const pl = Ls * 0.32 * Math.sin(Math.PI * Math.min(1, t * 1.05)) * (1 - t * 0.55) * (0.85 + rnd() * 0.3);

// ═════════════════════════════════════════ 3 · LINOCUT — one block, one ink
// Everything starts as ink. The picture is what the gouge took away: white
// lines between faces, hatching that lightens the lit planes, a sun carved
// clean with rays cut out of the sky. Then a hand print: the brayer leaves
// streaks, the paper's tooth breaks the solids, shallow cuts catch ink.
defMaterial({
  key: 'linocut', label: 'LINOCUT', field: '#eeae2a',
  pal: { paper: '#eeae2a', ink: '#1d1a2b', inkThin: '#4a3b34' },
  *build(L, out) {
    const P = this.pal, rnd = mulberry32(303), u = L.u, W = L.W, H = L.H, m = L.m;
    const blk = { x0: m, y0: m, x1: W - m, y1: H - m * 2.1 };
    // carve mask: black = ink stays, white = cut away
    const mk = () => { const c = makeCanvas(W, H), x = ctxOf(c); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); return [c, x]; };
    const [cv, k] = mk();
    const blockPts = wobble([[blk.x0, blk.y0], [blk.x1, blk.y0], [blk.x1, blk.y1], [blk.x0, blk.y1]], 14 * u, 1.6 * u, rnd);
    fillPoly(k, blockPts, '#000');
    k.save(); k.beginPath(); polyPath(k, blockPts); k.clip();
    const hy = L.P([0, -0.02])[1];
    const sun = SKELETON.sun, [scx, scy] = L.P([sun.cx, sun.cy]), sr = sun.r * L.s;
    // sky: horizontal gouge lines, wider (lighter) near the sun
    for (let y = blk.y0 + 6 * u; y < hy; y += (5.2 + rnd() * 1.2) * u) {
      let x = blk.x0 - 10 * u;
      while (x < blk.x1) {
        const len = (40 + rnd() * 160) * u, mx = x + len / 2;
        const dSun = Math.hypot(mx - scx, y - scy) / sr;
        const near = clamp(1.6 - dSun * 0.8), fall = clamp((y - blk.y0) / (hy - blk.y0));
        const w = (0.6 + near * 2.6 + fall * 1.2 + rnd() * 0.6) * u;
        // the hand drifts: each cut tilts a little with a slow flow across the sky
        const tilt = (fbm(mx / (260 * u), y / (180 * u), 2, 61) - 0.5) * 0.16 + (rnd() - 0.5) * 0.03;
        if (rnd() < 0.86) gouge(k, [x, y - Math.sin(tilt) * len / 2], [x + len, y + Math.sin(tilt) * len / 2], w, rnd);
        x += len + (3 + rnd() * 14) * u;
      }
    }
    // sun: a carved halo, then rays gouged out radially
    for (let i = 0; i < 64; i++) {
      const a = i / 64 * TAU + (rnd() - 0.5) * 0.03, r0 = sr * 1.04, r1 = sr * (1.18 + (i % 2) * 0.16 + rnd() * 0.08);
      gouge(k, [scx + Math.cos(a) * r0, scy + Math.sin(a) * r0], [scx + Math.cos(a) * r1, scy + Math.sin(a) * r1], (i % 2 ? 3.5 : 5.5) * u, rnd);
    }
    k.beginPath(); polyPath(k, wobble(ellipsePts(scx, scy, sr, sr, 120), 8 * u, 1.4 * u, rnd)); k.fillStyle = '#fff'; k.fill();
    for (let i = 1; i < 6; i++) {   // uncut rings inside the sun
      k.beginPath(); polyPath(k, wobble(ellipsePts(scx, scy, sr * (0.2 + i * 0.15), sr * (0.2 + i * 0.15), 90), 9 * u, 1.2 * u, rnd));
      k.strokeStyle = '#000'; k.lineWidth = (1.0 + rnd() * 0.8) * u; k.stroke();
    }
    yield;
    // ground: short curved cuts, sparser towards the viewer (darker foreground)
    for (let i = 0; i < 1400 * (W * H) / (1440 * 900); i++) {
      const y = hy + Math.pow(rnd(), 0.8) * (blk.y1 - hy), x = blk.x0 + rnd() * (blk.x1 - blk.x0);
      const f = (y - hy) / (blk.y1 - hy); if (rnd() < f * 0.55) continue;
      const l = (6 + rnd() * 18) * u * (1 - f * 0.3);
      gouge(k, [x, y], [x + l, y + (rnd() - 0.5) * 3 * u], (1.2 + (1 - f) * 2) * u, rnd);
    }
    // horizon: a clean carved line
    gouge(k, [blk.x0, hy], [blk.x1, hy + 1.5 * u], 2.6 * u, rnd);
    yield;
    // plinth
    const pl = SKELETON.parts[0];
    carveBlock(k, L, pl, rnd, { halo: 5 });
    // shadow of robot on plinth top: leave it solid (no hatching)
    fillPoly(k, L.PP([[-0.17, -0.005], [0.13, -0.005], [0.30, -0.04], [0.03, -0.04]]), '#000');
    // the body
    for (const p of SKELETON.parts) if (p.group === 'body') carveBlock(k, L, p, rnd, { halo: 4.5 });
    k.restore();
    yield;
    // pencil + print
    const base = makeCanvas(W, H), b = ctxOf(base);
    const paper = yield* makePaper(L, P.paper, { mottle: 0.05, tooth: 0.06, fibres: 260, seed: 33, warm: 8 });
    yield* printInk(b, cv, paper, L, P, 0, 0, W, H, null);
    const E = editionLayout(L, 9 * u);
    pencil(b, textStrokes('3/8  LINOCUT', E.left[0], E.left[1], E.size, 1.7, rnd, 0.4 * u), rnd, 'rgba(50,38,30,0.6)', 1.1 * u);
    const wm = 'PAPER ROBOTS', ww = textWidth(wm, E.size);
    pencil(b, textStrokes(wm, E.right[0] - ww, E.right[1], E.size, 1.7, rnd, 0.4 * u), rnd, 'rgba(50,38,30,0.6)', 1.1 * u);
    out.base = base;

    // fold: carved clean, one uncut crease

    hk.beginPath(); hk.moveTo(...fl[0]); hk.lineTo(...fl[2]); hk.strokeStyle = '#000'; hk.lineWidth = 2.2 * u; hk.stroke();
    for (let i = 1; i < 4; i++) { const a = lerpPt(fl[0], fl[2], i / 4); hk.beginPath(); hk.moveTo(...a); hk.lineTo(...lerpPt(a, fl[1], 0.55)); hk.lineWidth = 1 * u; hk.stroke(); }
    // ear: concentric uncut rings on a carved disc
    const e = SKELETON.ear, [ex, ey] = L.P([e.cx, e.cy]);
    hk.beginPath(); hk.ellipse(ex - e.rim * L.s * 0.6, ey, e.rx * L.s, e.ry * L.s, 0, 0, TAU); hk.fillStyle = '#000'; hk.fill();
    hk.beginPath(); hk.ellipse(ex, ey, e.rx * L.s, e.ry * L.s, 0, 0, TAU); hk.fillStyle = '#fff'; hk.fill();
    for (let i = 1; i <= 3; i++) { hk.beginPath(); hk.ellipse(ex, ey, e.rx * L.s * i / 3.6, e.ry * L.s * i / 3.6, 0, 0, TAU); hk.strokeStyle = '#000'; hk.lineWidth = 1.6 * u; hk.stroke(); }
    hk.beginPath(); hk.ellipse(ex, ey, e.rx * L.s, e.ry * L.s, 0, 0, TAU); hk.lineWidth = 2 * u; hk.stroke();
    // alpha: the head silhouette plus its carved halo
    const C = L.headCrop, head = makeCanvas(C.w, C.h), hc = ctxOf(head);
    const sil = makeCanvas(W, H), sc = ctxOf(sil);
    const hp = SKELETON.head;
    sc.lineJoin = 'round';
    for (const f of ['side', 'top', 'front']) { sc.beginPath(); polyPath(sc, L.PP(hp[f])); sc.fillStyle = '#000'; sc.fill(); sc.strokeStyle = '#000'; sc.lineWidth = 9 * u; sc.stroke(); }
    sc.beginPath(); sc.ellipse(ex, ey, e.rx * L.s * 1.3, e.ry * L.s * 1.15, 0, 0, TAU); sc.fill();
    sc.beginPath(); polyPath(sc, fl); sc.fill(); sc.stroke();

// a V-gouge cut: pointed entry, swelling body, lifted exit
function gouge(ctx, a, b, w, rnd, col = '#fff') {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
  const pk = 0.3 + rnd() * 0.3, n = Math.max(4, Math.round(l / 4));
  const top = [], bot = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, ww = w * 0.5 * Math.pow(Math.sin(Math.PI * Math.min(1, t < pk ? t / pk * 0.5 : 0.5 + (t - pk) / (1 - pk) * 0.5)), 0.6);
    const j = (rnd() - 0.5) * w * 0.12;
    top.push([a[0] + dx * t + nx * (ww + j), a[1] + dy * t + ny * (ww + j)]);
    bot.push([a[0] + dx * t - nx * (ww - j), a[1] + dy * t - ny * (ww - j)]);
  }
  ctx.beginPath(); polyPath(ctx, top.concat(bot.reverse())); ctx.fillStyle = col; ctx.fill();
}

// carve one block: halo around it, then the faces with their own hatching
function carveBlock(k, L, p, rnd, o = {}) {
  const u = L.u;
  const faces = { side: L.PP(p.side), top: L.PP(p.top), front: L.PP(p.front) };
  // halo so the form separates from the textured ground behind
  k.save(); k.lineJoin = 'round';
  for (const f of ['side', 'top', 'front']) { k.beginPath(); polyPath(k, faces[f]); k.strokeStyle = '#fff'; k.lineWidth = o.halo * 2 * u; k.stroke(); k.fillStyle = '#fff'; k.fill(); }
  k.restore();
  for (const f of ['side', 'top', 'front']) fillPoly(k, wobble(faces[f], 9 * u, 0.9 * u, rnd), '#000');
  // hatching per face: top = mostly cut away, front = medium, side = sparse
  const spec = {
    top: { ang: Math.atan2(DEPTH[1], DEPTH[0]), gap: 3.6, w: 2.4 },
    front: { ang: 0, gap: o.head ? 6.2 : 6.8, w: 1.5 },
    side: { ang: Math.PI / 2, gap: 9, w: 0.9 },
  };
  for (const f of ['top', 'front', 'side']) {
    const s = spec[f], pts = insetPoly(faces[f], 2.6 * u), bb = bboxOf(pts);
    k.save(); k.beginPath(); polyPath(k, pts); k.clip();
    const ca = Math.cos(s.ang), sa = Math.sin(s.ang), diag = Math.hypot(bb.w, bb.h), cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
    for (let d = -diag / 2; d < diag / 2; d += s.gap * u) {
      const ox = cx - sa * d, oy = cy + ca * d;
      // break each line into a few cuts, as a hand would

        if (rnd() < 0.9) gouge(k, [ox + ca * t, oy + sa * t], [ox + ca * (t + l), oy + sa * (t + l)], s.w * u * (0.7 + rnd() * 0.6), rnd);
        t += l + rnd() * 6 * u;
      }
    }
    k.restore();
  }
  // white lines between the faces
  k.save(); k.lineJoin = 'round';
  for (const f of ['top', 'side']) { k.beginPath(); polyPath(k, faces[f]); k.strokeStyle = '#fff'; k.lineWidth = 2.0 * u; k.stroke(); }
  k.restore();
}

// hand-printing: ink = uncut block × brayer load × paper tooth
function* printInk(ctx, carve, paper, L, P, x0, y0, w, h, silhouette) {
  const u = L.u;
  const cd = ctxOf(carve).getImageData(x0, y0, w, h).data;
  const pd = ctxOf(paper).getImageData(x0, y0, w, h).data;
  const sd = silhouette ? ctxOf(silhouette).getImageData(x0, y0, w, h).data : null;
  const img = ctx.createImageData(w, h), d = img.data;
  const ink = hexRGB(P.ink), thin = hexRGB(P.inkThin);
  yield* pixelRows(h, y => {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, X = x + x0, Y = y + y0;
      const block = 1 - cd[i] / 255;
      const streak = fbm(X / (320 * u), Y / (16 * u), 3, 71) - 0.5, blot = vnoise(X / (55 * u), Y / (55 * u), 72) - 0.5;
      const load = 0.98 + streak * 0.62 + blot * 0.3;
      const tooth = hash2(X, Y, 73) * 0.6 + vnoise(X / (1.7 * u), Y / (1.7 * u), 74) * 0.4;
      let cov = block * smooth(tooth * 0.55 + 0.2, tooth * 0.55 + 0.42, load);
      const c = mixRGB(thin, ink, clamp(load * 1.1 - 0.1));
      const pr = pd[i], pg = pd[i + 1], pb = pd[i + 2];
      d[i] = lerp(pr, c[0], cov); d[i + 1] = lerp(pg, c[1], cov); d[i + 2] = lerp(pb, c[2], cov);
      d[i + 3] = sd ? sd[i + 3] : 255;
    }
  });
  ctx.putImageData(img, 0, 0);
}
// ═════════════════════════════════════════ 4 · RISOGRAPH — two drums, two inks
// Fluorescent pink and blue, each its own stencil. Flat tints become riso
// grain; the sun's gradient is an AM halftone at 45°. The blue drum is a hair
// out of register, ink overprints (multiply) into violet, and big floods
// starve a little in the middle.
defMaterial({
  key: 'riso', label: 'RISOGRAPH', field: '#ff5bb5',
  pal: { paper: '#f3efe6', pink: '#ff48b0', blue: '#0078bf' },
  *build(L, out) {
    const P = this.pal, rnd = mulberry32(404), u = L.u, W = L.W, H = L.H, m = L.m;
    const mk = () => { const c = makeCanvas(W, H), x = ctxOf(c); x.fillStyle = '#000'; x.fillRect(0, 0, W, H); return [c, x]; };
    const tone = v => { const k = Math.round(clamp(v) * 255); return `rgb(${k},${k},${k})`; };
    const [pk, p] = mk(), [bk, b] = mk();
    const hy = L.P([0, -0.02])[1];
    const sun = SKELETON.sun, [scx, scy] = L.P([sun.cx, sun.cy]), sr = sun.r * L.s;
    // print area with a white border, as a riso can't print to the edge
    const pa = { x0: m * 0.7, y0: m * 0.7, x1: W - m * 0.7, y1: H - m * 2.0 };
    p.save(); p.beginPath(); p.rect(pa.x0, pa.y0, pa.x1 - pa.x0, pa.y1 - pa.y0); p.clip();
    b.save(); b.beginPath(); b.rect(pa.x0, pa.y0, pa.x1 - pa.x0, pa.y1 - pa.y0); b.clip();
    // pink: the field, flooded
    p.fillStyle = tone(0.78); p.fillRect(0, 0, W, H);
    // ground: pink stays, blue halftone lines make it violet towards us
    b.fillStyle = tone(0.0); b.fillRect(0, hy, W, H);
    for (let y = hy + 3 * u; y < H; y += 7 * u) {     // ruled lines get heavier towards the viewer
      const k = (y - hy) / (pa.y1 - hy);
      b.fillStyle = tone(1); b.fillRect(0, y, W, (0.6 + k * 4.2) * u);
    }

    b.save(); b.beginPath(); b.arc(scx, scy, sr, 0, TAU); b.clip();
    const cell = 8.5 * u, ang = Math.PI / 4, ca = Math.cos(ang), sa = Math.sin(ang);
    for (let i = -80; i < 80; i++) for (let j = -80; j < 80; j++) {
      const x = scx + (i * ca - j * sa) * cell, y = scy + (i * sa + j * ca) * cell;
      if (Math.abs(x - scx) > sr + cell || Math.abs(y - scy) > sr + cell) continue;
      const tv = smooth(scy - sr * 0.3, scy + sr, y);
      if (tv <= 0.02) continue;

    b.fillStyle = tone(1); b.fillRect(0, hy - 1.2 * u, W, 2.4 * u);
    yield;
    // plinth: pink knocks out where blue carries the form
    const drawBlock = (p, b, part, pinkT, blueT, halo) => {
      for (const f of ['side', 'top', 'front']) {
        const pts = L.PP(part[f]);
        // knock the field out a little wider than the shape (trap)
        p.beginPath(); polyPath(p, pts); p.lineWidth = halo * u; p.strokeStyle = tone(pinkT[f]); p.lineJoin = 'round'; p.stroke();
        p.fillStyle = tone(pinkT[f]); p.fill();
        b.beginPath(); polyPath(b, pts); b.fillStyle = tone(blueT[f]); b.fill();
      }
    };
    const plPink = { top: 0.22, front: 0.55, side: 0.95 }, plBlue = { top: 0.0, front: 0.18, side: 0.62 };
    drawBlock(p, b, SKELETON.parts[0], plPink, plBlue, 0);
    // halftone stone texture on the plinth front
    for (let i = 0; i < 120; i++) { const pt = L.P([-0.40 + rnd() * 0.74, 0.04 + rnd() * 0.1]); b.beginPath(); b.arc(pt[0], pt[1], (0.8 + rnd() * 1.8) * u, 0, TAU); b.fillStyle = tone(1); b.fill(); }
    // robot body: blue carries it; pink only in the shadow planes (violet)
    const rbPink = { top: 0.0, front: 0.0, side: 0.5 }, rbBlue = { top: 0.42, front: 0.78, side: 1.0 };
    for (const part of SKELETON.parts) if (part.group === 'body') drawBlock(p, b, part, rbPink, rbBlue, 3.2);
    // seams between faces: knocked out of blue (paper lines)
    const seams = (b, part) => { b.save(); b.lineJoin = 'round'; for (const f of ['top', 'side']) { b.beginPath(); polyPath(b, L.PP(part[f])); b.strokeStyle = tone(0); b.lineWidth = 1.6 * u; b.stroke(); } b.restore(); };
    for (const part of SKELETON.parts) if (part.group === 'body') seams(b, part);
    // cast shadow on plinth top: violet
    p.beginPath(); polyPath(p, L.PP([[-0.17, -0.005], [0.13, -0.005], [0.30, -0.04], [0.03, -0.04]])); p.fillStyle = tone(0.6); p.fill();
    b.beginPath(); polyPath(b, L.PP([[-0.17, -0.005], [0.13, -0.005], [0.30, -0.04], [0.03, -0.04]])); b.fillStyle = tone(0.45); b.fill();
    p.restore(); b.restore();
    // printed edition line, in blue ink, below the image
    const E = editionLayout(L, 10 * u);
    b.save(); b.lineCap = 'round'; b.lineJoin = 'round'; b.strokeStyle = tone(1); b.lineWidth = 1.6 * u;
    for (const pl of textStrokes('4/8  RISOGRAPH  PINK + BLUE', E.left[0], E.left[1], E.size, 1.6)) { b.beginPath(); polyPath(b, pl, false); b.stroke(); }
    const wm = 'PAPER ROBOTS', ww = textWidth(wm, E.size, 1.6);
    p.save(); p.lineCap = 'round'; p.strokeStyle = tone(1); p.lineWidth = 1.6 * u;
    for (const pl of textStrokes(wm, E.right[0] - ww, E.right[1], E.size, 1.6)) { p.beginPath(); polyPath(p, pl, false); p.stroke(); }
    p.restore(); b.restore();
    yield;

}
// the eyelid is made of the head's own material: re-draw the eye-less head
// inside the closing part of the eye, then a lid line in the material's ink.
function drawLid(ctx, c, cx, cy, r, k) {
  const C = L.headCrop, rr = r * 1.06;
  const edge = cy - rr + 2 * rr * k;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.clip();
  ctx.beginPath(); ctx.moveTo(cx - rr, cy - rr - 2);
  ctx.lineTo(cx + rr, cy - rr - 2); ctx.lineTo(cx + rr, edge);
  ctx.quadraticCurveTo(cx, edge + rr * 0.45 * k, cx - rr, edge); ctx.closePath(); ctx.clip();
  ctx.drawImage(c.head, C.x, C.y);
  ctx.restore();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.clip();
  ctx.beginPath(); ctx.moveTo(cx - rr, edge); ctx.quadraticCurveTo(cx, edge + rr * 0.45 * k, cx + rr, edge);
  ctx.strokeStyle = c.lidCol || 'rgba(20,20,30,0.9)'; ctx.lineWidth = Math.max(1, r * 0.09); ctx.lineCap = 'round'; ctx.stroke();
  ctx.restore();
  // fully shut: a lash line, so the eye reads as closed rather than gone
  if (k > 0.75) {
    ctx.save(); ctx.globalAlpha = smooth(0.75, 0.95, k);
    ctx.beginPath(); ctx.moveTo(cx - r * 0.82, cy + r * 0.05); ctx.quadraticCurveTo(cx, cy + r * 0.5, cx + r * 0.82, cy + r * 0.05);
    ctx.strokeStyle = c.lidCol || 'rgba(20,20,30,0.9)'; ctx.lineWidth = Math.max(1.2, r * 0.11); ctx.lineCap = 'round'; ctx.stroke();
    ctx.restore();
  }
}

function frame(t) {
  const st = idle(t);
  let m = mats[st.beat];
  if (forceMat) m = MATERIALS.find(x => x.key === forceMat) || m;
  let c = cache[m.key];
  if (!c || !c.ready) c = buildNow(m);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(c.base, 0, 0);
  if (m.drawHead) m.drawHead(ctx, c, L, st);
  else {
    const [px, py] = L.pivot;
    ctx.save();
    ctx.translate(px, py + st.bob * L.s); ctx.rotate(st.tilt); ctx.translate(-px, -py);
    ctx.drawImage(c.head, L.headCrop.x, L.headCrop.y);
    drawEyes(ctx, m, c, st);
    if (m.glint) m.glint(ctx, c, L, st);
    ctx.restore();
  }
  if (m.post) m.post(ctx, c, L, st);
  // queue the next materials so they are ready before their cut
  const next = mats[(st.beat + 1) % 8], after = mats[(st.beat + 2) % 8];
  for (const n of [next, after]) if (!cache[n.key] && !queue.includes(n)) queue.push(n);
}

function run() {
  sortMaterials();
  setup();
  // for capture tools: draw one exact moment on demand
  window.__renderAt = t => { frame(((t % LOOP) + LOOP) % LOOP); return true; };
  if (fixedT !== null || reduced) {
    const t = fixedT !== null ? fixedT : 0.6;
    frame(t);
    window.__ready = true;
    return;
  }
  let acc = 0, last = performance.now(), visible = !document.hidden, first = true;
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = performance.now(); if (visible) requestAnimationFrame(tick); });
  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { setup(); }, 180); });
  function tick(now) {
    if (!visible) return;
    acc += Math.min(0.1, (now - last) / 1000); last = now;
    frame(acc % LOOP);
    pump(6);
    if (first) { window.__ready = true; first = false; }
    requestAnimationFrame(tick);
  }
  // queue everything up front; the pump builds in slices while the first beat plays
  for (const m of mats) if (!queue.includes(m)) queue.push(m);
  requestAnimationFrame(tick);
}
run();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>San Kala — Four frames in mosaic</title>
<meta name="description" content="The sankala.me homepage desk, laid as a living mosaic: a comparison study.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap">
<style>
/* The homepage layout (src/styles/home.css), with the wall now laid in stone. The mosaic is the
   page; the words run down the calm courses of the wall on the left (wide) or beneath (phones). */
:root { --paper: #faf9f5; --ink: #202c38; --muted: #58616b; --line: #d9d9d2; --accent: #244f85; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.65 'DM Sans', system-ui, sans-serif; }
h1, h2, h3, p, figure { margin: 0; }
h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; line-height: 1.15; letter-spacing: -.035em; text-wrap: pretty; }
a { color: inherit; text-decoration: none; text-underline-offset: 4px; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
img { display: block; max-width: 100%; height: auto; }

.home-page { --ff-wall: #ebe3cc; --ff-gutter: clamp(20px, 5vw, 84px); --ff-sticky: min(56vh, 115vw); }
@supports (height: 1svh) { .home-page { --ff-sticky: min(56svh, 115vw); } }
.site-header { position: relative; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 32px; min-height: 88px; padding-inline: var(--ff-gutter); background: var(--ff-wall); }
.wordmark { font-family: 'Fraunces', Georgia, serif; font-size: 28px; letter-spacing: -.04em; white-space: nowrap; }
.wordmark span { color: var(--accent); }
.nav { display: flex; gap: 30px; align-items: center; font-size: 15px; }
.nav a { padding: 12px 0; }
@media (max-width: 600px) {
  .site-header { flex-direction: column; align-items: flex-start; gap: 8px; padding-block: 16px 8px; min-height: 0; }
  .nav { width: 100%; justify-content: space-between; gap: 0; font-size: 14px; }
  .nav a { padding-block: 8px; }
}

.four-frames { position: relative; }
.ff-stage { position: sticky; top: 0; z-index: 3; height: var(--ff-sticky); overflow: hidden; background: var(--ff-wall); }
.ff-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .6s ease; }
.four-frames.is-live .ff-canvas { opacity: 1; }
.ff-caption { position: absolute; top: 8px; right: 14px; margin: 0; padding: 2px 8px; font-size: 12px; line-height: 1.3; color: #3c4650; background: rgba(235,227,204,.9); border-radius: 2px; font-variant-numeric: tabular-nums; }

.ff-lane { --ff-link: var(--accent); --ff-muted: #46504a; position: relative; z-index: 2; padding: 26px var(--ff-gutter) 64px; background: var(--ff-wall); color: var(--ink); }
.ff-lane a { color: var(--ff-link); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
.ff-lane a:hover { text-decoration-thickness: 2px; }
.ff-frame { min-height: 74vh; }
.ff-frame:last-child { min-height: 0; padding-bottom: 16vh; }
.ff-intro { padding-bottom: 10vh; }
.ff-intro h1 { font-size: clamp(36px, 3.6vw, 54px); letter-spacing: -.04em; }
.ff-lede { margin-top: 20px; font-size: 17.5px; line-height: 1.58; max-width: 31em; }
.ff-more { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 15px; }
.ff-mail { color: var(--ff-muted); user-select: all; }
.ff-cue { margin-top: 26px; font-size: 13.5px; line-height: 1.55; color: var(--ff-muted); max-width: 30em; }
.ff-clock { display: block; min-height: 1.55em; margin-top: 4px; }
.ff-path { margin-top: 14vh; font-size: 28px; letter-spacing: -.03em; }
.ff-place { display: flex; flex-direction: column; gap: 2px; padding-top: 16px; margin-top: 24px; border-top: 1px solid rgba(32, 44, 56, .2); scroll-margin-top: calc(var(--ff-sticky) + 12px); }
.ff-years { font-size: 13px; color: var(--ff-muted); font-variant-numeric: tabular-nums; }
.ff-place h2 { font-size: 30px; letter-spacing: -.035em; }
.ff-role { font-size: 15px; color: var(--ff-muted); }
.ff-entries { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 26px; }
.ff-entries > li { scroll-margin-top: calc(var(--ff-sticky) + 16px); }
.ff-entries > li.has-print { display: grid; grid-template-columns: minmax(0, 1fr) 78px; gap: 18px; align-items: start; }
.ff-entries time { display: block; font-size: 12.5px; color: var(--ff-muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.ff-entries h3 { font: 600 16px/1.35 'DM Sans', sans-serif; letter-spacing: 0; }
.ff-entries p { margin-top: 5px; font-size: 15px; line-height: 1.58; }
.ff-links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
.ff-print { display: block; margin-top: 20px; padding: 4px 4px 5px; background: #fbfaf5; box-shadow: 0 .5px 1px rgba(40, 32, 20, .22), 0 8px 14px -10px rgba(40, 32, 20, .55); transform: rotate(2.2deg); transition: transform .3s ease; }
.ff-entries > li:nth-child(even) .ff-print { transform: rotate(-2deg); }
.ff-print img { width: 100%; }
.ff-lane a.ff-print { text-decoration: none; }
.ff-print:hover, .ff-print:focus-visible { transform: rotate(0) translateY(-2px); }
.ff-plain-still { display: none; }
.ff-lightbox { max-width: min(1100px, 94vw); max-height: 94dvh; border: 0; padding: 20px; background: var(--paper); color: var(--ink); }
.ff-lightbox::backdrop { background: rgba(17, 28, 43, .9); }
.ff-lightbox img { max-height: 76dvh; width: auto; max-width: 100%; margin: auto; object-fit: contain; }
.ff-lightbox figcaption { margin-top: 12px; text-align: center; font-size: 13px; color: var(--muted); }
.ff-lightbox-close { display: block; margin: 0 0 14px auto; font: inherit; font-size: 13px; padding: 8px 14px; background: transparent; border: 1px solid var(--line); cursor: pointer; }

@media (min-aspect-ratio: 29/20) and (min-width: 1000px) {
  .home-page { --ff-sticky: 100vh; }
  .site-header { position: absolute; top: 0; left: 0; right: 0; min-height: 84px; background: transparent; }
  .site-header .nav { padding: 2px 12px; background: rgba(235,227,204,.92); border-radius: 3px; }
  .ff-stage { height: 100vh; z-index: 1; }
  .ff-caption { display: none; }
  .ff-lane { z-index: 2; margin-top: -100vh; margin-left: var(--ff-gutter); width: min(452px, calc(max(100vw - 100vh, 520px) - var(--ff-gutter) - 48px)); padding: 0 0 46vh; background: none; }
  .ff-frame { min-height: 118vh; }
  .ff-frame:last-child { min-height: 96vh; padding-bottom: 0; }
  .ff-intro { padding-top: 22vh; padding-bottom: 6vh; }
  .ff-path { margin-top: 26vh; }
  .ff-place { scroll-margin-top: 18vh; }
  .ff-entries > li { scroll-margin-top: 20vh; }
}

/* the plain version, and for readers who prefer less motion */
.four-frames.is-plain .ff-stage { display: none; }
.four-frames.is-plain .ff-lane { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 40px; background: none; }
.four-frames.is-plain .ff-frame { min-height: 0; margin-bottom: 40px; }
.four-frames.is-plain .ff-intro { padding: 32px 0 24px; }
.four-frames.is-plain .ff-path { margin-top: 48px; }
.four-frames.is-plain .ff-plain-still { display: block; margin: 24px 0 18px; }
.four-frames.is-plain .ff-plain-still canvas { display: block; max-width: 100%; }
.four-frames.is-plain .ff-clock { display: none; }
.home-page:has(.four-frames.is-plain) .site-header { position: relative; background: var(--paper); }
.home-page:has(.four-frames.is-plain) .site-header .nav { background: none; }
@media (prefers-reduced-motion: reduce) { .ff-print { transition: none; } .ff-canvas { transition: none; } }

.after { width: min(1160px, calc(100% - 2 * var(--ff-gutter))); margin: 0 auto; padding-block: 56px 72px; display: grid; gap: 14px; border-top: 1px solid var(--line); }
.after h2 { font-size: clamp(26px, 3vw, 34px); }
.after p { color: var(--muted); max-width: 36em; }
.after nav { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 15px; }
.after nav a { text-decoration: underline; text-decoration-color: #a2a7ab; text-underline-offset: 5px; }
</style>
</head>
<body>
<div class="home-page">
  <header class="site-header">
    <a class="wordmark" href="https://www.sankala.me/">San Kala<span>.</span></a>
    <nav class="nav" aria-label="Main"><a href="https://www.sankala.me/work">Work</a><a href="https://www.sankala.me/history">Timeline</a><a href="https://www.sankala.me/about">About</a><a href="https://www.sankala.me/resume">CV</a></nav>
  </header>
  <main id="main">
    <div class="four-frames" id="home">
      <div class="ff-stage">
        <canvas class="ff-canvas" aria-hidden="true"></canvas>
        <p class="ff-caption" aria-hidden="true">San Jose</p>
      </div>
      <div class="ff-lane"></div>
      <dialog class="ff-lightbox" aria-label="Photograph"><button type="button" class="ff-lightbox-close">Close ×</button><figure></figure></dialog>
    </div>
    <section class="after" aria-labelledby="after-title">
      <h2 id="after-title">Writing and work</h2>
      <p>Comparison study: the same homepage desk, laid as a mosaic whose stones follow the shapes. The scene behind the stones moves; the stones stay put. Everything except the photographs is made in code.</p>
      <nav aria-label="More"><a href="https://www.sankala.me/work">All work</a><a href="https://www.sankala.me/history">The full history</a><a href="https://www.paperrobots.studio/">Paper Robots</a></nav>
    </section>
  </main>
</div>
<!-- ES modules when served; one bundled script (./build.sh) when opened straight from disk -->
<script type="module">if (location.protocol !== 'file:') import('./js/main.js');</script>
<script>if (location.protocol === 'file:') { const s = document.createElement('script'); s.src = 'js/bundle.js'; document.body.appendChild(s); }</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homepage mosaic printing harness</title>
<!-- Loaded by scripts/publishing/render-home.mjs through the Vite dev server. It lays the apse with
     the same code the homepage's live layer runs (src/pages/home/mosaic/) and hands the stills back
     as data URLs, and the wall's light data as base64. -->
</head>
<body>
<script type="module">
import { layArch, layPlace, runAll, encodeWallGlint } from '/src/pages/home/mosaic/build.js';
import { paintArch, paintPlace } from '/src/pages/home/mosaic/paint.js';
import { sheetOf, conchBox, FAMILIES, RI } from '/src/pages/home/mosaic/layout.js';
import * as tiles from '/src/pages/home/mosaic/tiles.js';

const out = (canvas, type = 'image/webp', q = .8) => canvas.toDataURL(type, q);
const timed = fn => { const t0 = performance.now(); const r = fn(); return [r, Math.round(performance.now() - t0)]; };
const archCache = new Map(), placeCache = new Map();
const arch = key => { if (!archCache.has(key)) archCache.set(key, timed(() => runAll(layArch(key)))); return archCache.get(key); };
const place = (family, index, moment) => { const k = `${family}/${index}/${moment}`; if (!placeCache.has(k)) placeCache.set(k, timed(() => runAll(layPlace(family, index, moment)))); return placeCache.get(k); };

// The wall, archivolt and cornice of a class's sheet, at `scale` px per unit.
window.renderWall = ({ cls, scale, q = .8 }) => {
  const [layer, ms] = arch(cls), S = layer.S;
  const W = Math.round((S.x1 - S.x0) * scale), H = Math.round((S.y1 - S.y0) * scale);
  const s = W / (S.x1 - S.x0), canvas = new OffscreenCanvas(W, H), c = canvas.getContext('2d');
  paintArch(c, layer, { s, x: -S.x0 * s, y: -S.y0 * s }, W, H);
  return canvasData(canvas, 'image/webp', q).then(data => ({ data, width: W, height: H, layMs: ms, stones: layer.stones.length }));
};
// The wall's light data (gold, silver, gems, some glass), base64.
window.wallGlint = ({ cls }) => {
  const [layer] = arch(cls);
  const buf = encodeWallGlint(layer.stones, layer.q);
  let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return { data: btoa(s), bytes: b.length };
};
// One conch: `index` into the places, San Jose with a moment; transparent outside the conch.
window.renderConch = ({ family, index, moment, scale, q = .8 }) => {
  const [layer, ms] = place(family, index, moment), F = FAMILIES[family].F, box = conchBox(F);
  const W = Math.round((box.x1 - box.x0) * scale), s = W / (box.x1 - box.x0), H = Math.round((box.y1 - box.y0) * s);
  const canvas = new OffscreenCanvas(W, H), c = canvas.getContext('2d');
  paintPlace(c, layer, { s, x: -box.x0 * s, y: -box.y0 * s });
  return canvasData(canvas, 'image/webp', q).then(data => ({ data, width: W, height: H, layMs: ms, stones: layer.stones.length, alt: layer.place.alt(layer.L) }));
};
// Tiles for the CSS: the frames, the stele's heads, the coursed wall, the frieze, the marble.
window.renderTile = async ({ name, args = {}, type = 'image/webp', q = .82 }) => {
  const canvas = await tiles[name](args);
  return { data: await canvasData(canvas, type, q), width: canvas.width, height: canvas.height, meta: canvas.meta || null };
};
window.renderSocial = async () => {
  const canvas = await tiles.socialCard({ wall: arch('side')[0], conch: place('fine', 0, 'golden-pm')[0] });
  return { data: await canvasData(canvas, 'image/jpeg', .82) };
};
async function canvasData(canvas, type, q) {
  const blob = await canvas.convertToBlob({ type, quality: q });
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return `data:${type};base64,` + btoa(s);
}
void RI; void sheetOf;
window.__ready = true;
</script>
</body>
</html>
